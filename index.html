<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      Free Online Tools for Image, PDF, Text & More | Smart Tools
    </title>

    <meta
      name="description"
      content="Use free online tools for image compression, image resizing, PDF tools, text tools, calculators, QR code generation, SEO and developer utilities. Fast, private and easy to use."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <link
      rel="canonical"
      href="https://toolzy.online/"
    />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:title"
      content="Free Online Tools for Image, PDF, Text & More | Smart Tools"
    />

    <meta
      property="og:description"
      content="Free online tools for image compression, resizing, PDF, text, calculators, QR codes, SEO and developer utilities. Fast, private and easy to use."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://toolzy.online/"
    />

    <meta
      property="og:site_name"
      content="Smart Tools"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Free Online Tools for Image, PDF, Text & More | Smart Tools"
    />

    <meta
      name="twitter:description"
      content="Free online tools for image compression, resizing, PDF, text, calculators, QR codes, SEO and developer utilities."
    />

    <!-- Search/Browser -->
    <meta
      name="theme-color"
      content="#f8fafc"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Smart Tools",
      "url": "https://toolzy.online/",
      "description": "Free online tools for image compression, image resizing, PDF, text, calculators, QR codes, SEO and developer utilities.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://toolzy.online/?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
